name: Project memory
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  memory:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
      - name: Test memory tooling
        run: |
          python3 -m unittest discover -s scripts/tests -p test_project_memory.py
          python3 -m unittest discover -s scripts/tests -p test_task_handoff.py
      - name: Check bounded handoff and preserved history
        run: python3 scripts/task_handoff.py check
      - name: Check change documentation
        env:
          MEMORY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$MEMORY_BASE" ] && git cat-file -e "$MEMORY_BASE^{commit}" 2>/dev/null; then
            python3 scripts/project_memory.py check --base "$MEMORY_BASE"
          else
            python3 scripts/project_memory.py check --metadata-only
          fi
