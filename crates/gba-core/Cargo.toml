[package]
name = "gba-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GBA machine model: ARM7TDMI interpreter, memory map, hardware"

[features]
parallel-ppu = ["dep:rayon"]

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rayon = { version = "1.12", optional = true }
armv4t = { path = "../armv4t" }
sha2 = "0.11.0"

# Host clock for the cartridge RTC, per platform. Unix uses libc's
# localtime_r (glibc/musl/bionic/BSD — no distro assumptions); Windows uses
# GetLocalTime. Both crates are already in the workspace lockfile.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_SystemInformation"] }
