[package]
name = "recomp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Static recompiler CLI"

[dependencies]
serde = { version = "1", features = ["derive"] }
tempfile = "3"
armv4t = { path = "../armv4t" }
gba-core = { path = "../gba-core" }
recomp-core = { path = "../recomp-core" }
gamedb = { path = "../gamedb" }
winit = "0.30"
softbuffer = "0.4"
libloading = "0.8"
cpal = "0.16"
gilrs = "0.11.2"
input-config = { version = "0.2.0", path = "../input-config" }
screen = { version = "0.2.0", path = "../screen" }
menu = { version = "0.2.0", path = "../menu" }
sha2 = "0.11.0"
dirs = "6.0.0"
toml = "0.8"
serde_json = "1.0.150"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
rfd = "0.15"

[build-dependencies]
winresource = "0.1"
